[output]
dir = "./showcase"

[[output.formats]]
output_type = "png"

[[output.formats]]
output_type = "gif"

[font]
family = "Iosevka Nerd Font Mono"

[[scenes]]
type = "terminal"
name = "sr-plan"
theme = "dracula"
cols = 100
rows = 34

[scenes.intro]
text = "sr plan\nPreview the next release before it happens"
duration = 2000
center = true

# Hidden: neutral prompt, plus one unreleased feat commit so the plan has work to show
[[scenes.interactions]]
type = "type"
text = "export PS1='$ ' && git commit --allow-empty -qm 'feat: add a demo feature' && clear"
speed = 0
hidden = true
[[scenes.interactions]]
type = "key"
key = "enter"
hidden = true
[[scenes.interactions]]
type = "wait"
duration = 1000
hidden = true

