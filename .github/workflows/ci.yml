name: CI

on:
  pull_request:
    branches: [main]
  schedule:
    # Weekly: catch an ecosystem lock format moving under sr's offline rewrites.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: sr
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sr
      - run: cargo check --workspace
        working-directory: sr

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: sr
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sr
      - run: cargo clippy --workspace -- -D warnings
        working-directory: sr

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: sr
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
        working-directory: sr

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: sr
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sr
      - run: cargo test --workspace
        working-directory: sr

  conformance:
    name: Lock conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: sr
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sr
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: pipx install poetry
      # sr rewrites Cargo.lock / uv.lock / poetry.lock / package-lock.json
      # offline. These tests re-lock with each real tool and demand a
      # byte-identical result, so a format change surfaces here rather than in
      # someone's release commit. On failure: re-verify the rewrite in
      # version_files.rs and update the matching *_LOCK_MAX_VERSION.
      - run: cargo test -p sr-core --test lock_conformance -- --ignored --nocapture
        working-directory: sr

  embed:
    name: Embed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: urmzd/fsrc@v4
        with:
          files: README.md
          commit-dry: "true"
          commit-push: "false"
