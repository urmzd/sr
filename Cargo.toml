[workspace]
members = ["crates/core", "crates/cli"]
resolver = "2"

[workspace.package]
version = "8.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/urmzd/sr"
authors = ["urmzd"]
homepage = "https://github.com/urmzd/sr"

[workspace.dependencies]
# Internal crates
sr-core = { path = "crates/core", version = "8.1.0" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"

# Regex
regex = "1"

# Versioning
semver = { version = "1", features = ["serde"] }

# Templating
minijinja = "2"

# CLI
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"

# Serialization (JSON)
# `preserve_order` keeps JSON keys in their original order on rewrite. Without
# it every package.json and package-lock.json sr touches comes back
# alphabetized, which is a spurious diff in the release commit and makes the
# lock differ from what npm itself writes.
serde_json = { version = "1", features = ["preserve_order"] }
toml_edit = "0.22"

# Error handling
thiserror = "2"
anyhow = "1"

# HTTP
ureq = { version = "3", features = ["json"] }

# Encoding
base64 = "0.22"

# Globbing
glob = "0.3"

# Hashing
sha2 = "0.10"

# Directories
dirs = "6"

# Testing
tempfile = "3"
